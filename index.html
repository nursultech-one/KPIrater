<style>
:root{--bg:#F2F4F0;--surface:#fff;--ink:#17241D;--soft:#4C5A52;--line:#DDE3DC;--forest:#1F4B3E;--forest-d:#132F27;--gold:#B4842A;--gold-soft:#F4E8D2;--red:#B5432F;--red-soft:#F7E3DE;--green:#2E7D4F;--green-soft:#E1EEE3;--shadow:0 1px 2px rgba(20,30,24,.06),0 6px 20px rgba(20,30,24,.05);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--surface:#161E19;--ink:#EAF0EA;--soft:#9AABA1;--line:#28352E;--forest:#4C9878;--forest-d:#8FD1AE;--gold:#D8A75B;--gold-soft:#2A2416;--red-soft:#33201C;--green:#7CCB9B;--green-soft:#1B2A20;}}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
.serif{font-family:"Source Serif 4",Georgia,serif}
header.top{position:sticky;top:0;z-index:20;background:#132F27;color:#F4F6F2;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-weight:700}
header.top .mark{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#132F27;display:flex;align-items:center;justify-content:center;font-family:"Source Serif 4",serif;font-weight:600;font-size:16px;flex:none}
header.top span.sep{opacity:.6;font-weight:500}
main{max-width:1000px;margin:0 auto;padding:26px 20px 64px}
h1{font-family:"Source Serif 4",serif;font-weight:600;font-size:clamp(24px,4vw,32px);margin:0 0 8px}
.lead{color:var(--soft);margin:0 0 20px;max-width:66ch;line-height:1.55;font-size:15px}
.back{display:inline-flex;background:none;border:none;color:var(--forest);font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;padding:0;margin-bottom:16px}
:root[data-theme="dark"] .back{color:var(--forest-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .back{color:var(--forest-d)}}
.btn{border:1px solid var(--forest);background:var(--forest);color:#fff;border-radius:8px;padding:9px 18px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.92)}
.btn.small{padding:7px 14px;font-size:12.5px}
.list{display:flex;flex-direction:column;gap:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kcard .info{flex:1 1 300px;min-width:0}
.kname{font-weight:700;font-size:14.5px;line-height:1.45;margin-bottom:6px}
.code{font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--soft)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--soft)}
.badge{font-weight:700;font-variant-numeric:tabular-nums;background:var(--gold-soft);color:#7A5A17;border-radius:999px;padding:3px 10px;font-size:12.5px}
.badge.done{background:var(--green-soft);color:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:var(--gold)}:root:not([data-theme="light"]) .badge.done{color:var(--green)}}
.box{display:flex;gap:10px;padding:11px 14px;border-radius:8px;font-size:13px;line-height:1.5;margin-bottom:8px}
.box.warn{background:var(--red-soft);color:var(--red)}
.box.note{background:var(--gold-soft);color:#7A5A17}
.box.ok{background:var(--green-soft);color:var(--green);font-weight:600;display:none}
.box.ok.show{display:flex}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .box.note{color:var(--gold)}}
.kbar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.kbar .kname{margin:0 0 6px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.prow .ptext{font-size:13.5px;color:var(--soft);font-weight:600}
h2.t{font-size:15px;margin:22px 0 10px}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{text-align:left;font-weight:600;color:var(--soft);font-size:11.5px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td .sub{display:block;color:var(--soft);font-size:11.5px;margin-top:2px}
input[type=number]{width:72px;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;text-align:center}
input.bad{border-color:var(--red)}
textarea{width:100%;min-height:42px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;resize:vertical}
textarea.req{border-color:var(--red)}
.cm{display:none}.cm.show{display:block}
.dash{color:var(--soft)}.dash.hide{display:none}
.zero{color:var(--red);font-size:11.5px;font-weight:600}
footer{margin-top:26px;font-size:12px;color:var(--soft);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>

<script>
/* DEMO: one rater who rates 3 KPIs. Change this array to try other KPI codes from the list. */

const myKpis=RATER_KPIS.map(c=>DATA.find(k=>k.code===c)).filter(Boolean);
/* same people as the admin popup "Baholanadigan xodimlar ro'yxati": BazaHR rows whose KPI_ID belongs to the KPI */
const peopleOf=k=>{const o=[];k.positions.forEach(p=>(EMP[p.id]||[]).forEach(r=>o.push({dep:r[0],id:r[5],n:r[6],t:r[7],l:r[9]})));return o;};
const ratedCount=(code)=>Object.values(ratings[code]||{}).filter(r=>r.score).length;

function route(){
  const h=location.hash;
  if(h.startsWith('#grade/'))renderGrade(decodeURIComponent(h.slice(7)));else renderHome();
}
window.addEventListener('hashchange',route);

    return `<div class="kcard"><div class="info"><div class="kname">${esc(k.name)}</div>

      <button class="btn small" onclick="location.hash='#grade/${encodeURIComponent(k.code)}'">Баҳолаш</button></div>`;}).join('')}</div>`;
}

function renderGrade(code){

  app.innerHTML=`<button class="back" onclick="location.hash=''">← Кўрсаткичлар рўйхатига қайтиш</button>
  <h1>Ходимларни баҳолаш</h1>

  <div class="box note">✎ Мажбурий изоҳ: 7 балдан паст баҳо қўйилганда, изоҳ майдони тўлдирилиши шарт.</div>
  <div class="box ok" id="ok">✓ Баҳолар муваффақиятли юборилди.</div>
  <div class="prow"><span class="ptext" id="ptext"></span><button class="btn" onclick="submitAll('${esc(code)}')">Барча баҳоларни юбориш</button></div>
  <h2 class="t">Баҳолаш жадвали</h2>
  <div class="tw"><table><thead><tr><th>Ходим</th><th style="width:110px">Балл</th><th>Изоҳ</th></tr></thead><tbody id="tb">
  ${emps.map(p=>{const r=ratings[code][p.t]||{},low=r.score&&r.score<7;
   return `<tr data-t="${esc(p.t)}"><td><b>${esc(p.n)}</b><span class="sub">${esc(p.l)} · ${esc(p.t)} · ${esc(p.dep)}</span></td>
   <td><input type="number" min="1" max="10" step="1" value="${r.score||''}" class="${r.score&&r.score<5?'bad':''}" oninput="onScore('${esc(code)}','${esc(p.t)}',this)"><div class="zero" style="display:${r.score&&r.score<5?'block':'none'}">0%</div></td>
   <td><span class="dash ${low?'hide':''}">—</span><textarea class="cm ${low?'show':''}" placeholder="Изоҳни киритинг (мажбурий)" oninput="onComment('${esc(code)}','${esc(p.t)}',this)">${esc(r.comment||'')}</textarea></td></tr>`;}).join('')}
  </tbody></table></div>
  <footer>Прототип: баҳолар фақат ушбу браузерда локал сақланади. Ходимлар рўйхати админ панелидаги "Baholanadigan xodimlar ro'yxati" билан айнан бир хил.</footer>`;
  prog(code);
}
function prog(code){const n=document.querySelectorAll('#tb tr').length;const p=document.getElementById('ptext');if(p)p.textContent=ratedCount(code)+' / '+n+' ходим баҳоланди';}
function onScore(code,t,el){
  let v=parseInt(el.value,10);v=isNaN(v)?null:Math.max(1,Math.min(10,v));
  const r=(ratings[code][t]=ratings[code][t]||{});r.score=v;
  const tr=el.closest('tr'),cm=tr.querySelector('.cm'),dash=tr.querySelector('.dash'),zero=tr.querySelector('.zero');
  const low=v!==null&&v<7;
  cm.classList.toggle('show',low);dash.classList.toggle('hide',low);
  if(!low){cm.classList.remove('req');}
  el.classList.toggle('bad',v!==null&&v<5);zero.style.display=(v!==null&&v<5)?'block':'none';
  document.getElementById('ok').classList.remove('show');
  save();prog(code);
}
function onComment(code,t,el){(ratings[code][t]=ratings[code][t]||{}).comment=el.value;el.classList.remove('req');save();}
function submitAll(code){
  let ok=true,first=null;
  document.querySelectorAll('#tb tr').forEach(tr=>{
    const r=ratings[code][tr.dataset.t],inp=tr.querySelector('input'),ta=tr.querySelector('textarea');
    if(!r||!r.score){ok=false;inp.classList.add('bad');first=first||inp;return;}
    if(r.score<7&&!(r.comment&&r.comment.trim())){ok=false;ta.classList.add('req');first=first||ta;}
  });
  const box=document.getElementById('ok');
  if(!ok){box.classList.remove('show');if(first){first.scrollIntoView({block:'center',behavior:'smooth'});first.focus();}return;}
  save();box.classList.add('show');box.scrollIntoView({block:'center',behavior:'smooth'});
}
Object.assign(window,{onScore,onComment,submitAll});
route();
</script>
</body>
</html>
